services:
  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - gateway-network

  gateway:
    build: ./gateway
    # Removed host port mapping "8080:8080" so traffic is routed exclusively through NGINX
    expose:
      - "8080"
    environment:
      - PORT=8080
      - JWT_SECRET=super-secret-change-me
      - SERVICE_A_URL=http://service-a:4001
      - SERVICE_B_URL=http://service-b:4002
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_CAPACITY=10
      - RATE_LIMIT_REFILL_RATE=1
    depends_on:
      - service-a
      - service-b
      - redis
    networks:
      - gateway-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - gateway-network

  anomaly-detector:
    build: ./anomaly-detector
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - gateway-network

  service-a:
    build: ./services/service-a
    ports:
      - "4001:4001"
    networks:
      - gateway-network

  service-b:
    build: ./services/service-b
    ports:
      - "4002:4002"
    networks:
      - gateway-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=audit_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gateway-network

  logger-worker:
    build: ./logger-worker
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/audit_db
    depends_on:
      - redis
      - postgres
    networks:
      - gateway-network

  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    networks:
      - gateway-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - gateway-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge