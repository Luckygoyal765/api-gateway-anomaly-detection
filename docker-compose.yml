version: "3.8"

services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=super-secret-change-me
      - SERVICE_A_URL=http://service-a:4001
      - SERVICE_B_URL=http://service-b:4002
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_CAPACITY=10
      - RATE_LIMIT_REFILL_RATE=1
    depends_on:
      - service-a
      - service-b
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  anomaly-detector:
    build: ./anomaly-detector
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  service-a:
    build: ./services/service-a
    ports:
      - "4001:4001"

  service-b:
    build: ./services/service-b
    ports:
      - "4002:4002"
