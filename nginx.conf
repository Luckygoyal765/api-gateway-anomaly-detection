events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        # Direct Prometheus Metrics Endpoint
        location /prometheus-metrics {
            set $prometheus_upstream http://prometheus:9090/metrics;
            proxy_pass $prometheus_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Catch-all Route: Send all traffic (/auth, /stats, /health, /metrics, etc.) to the API Gateway
        location / {
            set $gateway_upstream http://gateway:8080;
            proxy_pass $gateway_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}