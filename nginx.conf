events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Extract client request ID or fallback to NGINX generated $request_id
    map $http_x_request_id $request_id_to_use {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 80;

        # Direct Prometheus Metrics Endpoint
        location /prometheus-metrics {
            set $prometheus_upstream http://prometheus:9090/metrics;
            proxy_pass $prometheus_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_to_use;
        }

        # Catch-all Route: Send all traffic to the API Gateway
        location / {
            set $gateway_upstream http://gateway:8080;
            proxy_pass $gateway_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass the trace ID header to Express Gateway
            proxy_set_header X-Request-ID $request_id_to_use;
        }
    }
}